# Konfigurierbare CSV-Importformate. Der Text nach dem Doppelpunkt im Abschnittsnamen ist der Formatname.
# Buchung: Konto.Name, Konto.Iban, Konto.Nummer, Konto.Bank, Konto.Bic, Datum, Valuta, Betrag, Waehrung,
#   Zweck, Name, Iban, Bic, Empfaenger.Kontonummer, Empfaenger.Blz, Empfaenger.Bank, Buchungstyp,
#   Hauptkategorie, Unterkategorie, Sepa.Kundenreferenz, Sepa.GlaeubigerId, Sepa.EndToEnd, Sepa.Mandat,
#   Sepa.PersonenId, Sepa.Zweck, Sepa.Typ, Kreditkarte.Transaktionsdatum, Kreditkarte.Typ,
#   Kreditkarte.Waehrungsbetrag, Kreditkarte.Wechselkurs, Kreditkarte.Waehrung,
#   Kreditkarte.Haendlerregion, Kreditkarte.Haendlerkategorie, Gebuehr.Betrag und Gebuehr.Waehrung
# Depotumsatz/Kontoumsatz: Transaktion.Datum, Transaktion.Typ, Transaktion.Wert,
#   Transaktion.Buchungswaehrung, Transaktion.Bruttobetrag, Transaktion.Bruttowaehrung,
#   Transaktion.Wechselkurs, Transaktion.Gebuehren, Transaktion.Steuern, Transaktion.Stueck,
#   Transaktion.Notiz sowie Wertpapier.Name, Wertpapier.Isin, Wertpapier.Wkn und Wertpapier.Ticker
# Wertpapier: Wertpapier.Name, Wertpapier.Waehrung, Wertpapier.Isin, Wertpapier.Wkn,
#   Wertpapier.Ticker und Wertpapier.Anbieter
# Wertpapierkurs: Wertpapierkurs.Datum; alle weiteren CSV-Spalten werden als Wertpapierkennungen behandelt.
# Gemeinsame Optionen: Format.DateOrder und Format.DateOrderValuta (TMJ/MTJ/JMT),
#   Format.DecimalSeparator, Format.ThousandSeparator, Default.Waehrung, Extra.Separator, Extra.Header,
#   Extra.SwapAmount, Extra.NoZweckColumnNames, Ignore.LeadingRows, Ignore.TrailingRows, Dialog.Filter,
#   Dialog.DefaultExt und Dialog.Filename.

