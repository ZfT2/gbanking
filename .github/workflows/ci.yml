name: Build and Test

on:
    push:
        branches:
            - "**"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: build-test-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Compile and test
        runs-on: ubuntu-latest
        env:
            MAVEN_USERNAME: ZfT2
            MAVEN_PASSWORD: ${{ secrets.GH_PACKAGES_TOKEN }}

        steps:
            - name: Delay for follow-up commits
              run: sleep 120

            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Java 17
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "17"
                  cache: maven
                  server-id: github
                  server-username: MAVEN_USERNAME
                  server-password: MAVEN_PASSWORD

            - name: Compile and test
              timeout-minutes: 20
              run: xvfb-run -a mvn -B clean test

